services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routinely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routinely}
      POSTGRES_DB: ${POSTGRES_DB:-routinely}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
