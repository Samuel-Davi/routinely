# Production-like stack: `cp .env.example .env && docker compose up --build`.
# For hot reload, add the dev override: see docker-compose.dev.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routinely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routinely}
      POSTGRES_DB: ${POSTGRES_DB:-routinely}
    ports:
      # Published for local tooling (pnpm dev, e2e tests, Prisma Studio).
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal

  # One-shot: applies migrations and the seed, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routinely}:${POSTGRES_PASSWORD:-routinely}@db:5432/${POSTGRES_DB:-routinely}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-routinely}:${POSTGRES_PASSWORD:-routinely}@db:5432/${POSTGRES_DB:-routinely}?schema=public
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inside the compose network the database host is "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-routinely}:${POSTGRES_PASSWORD:-routinely}@db:5432/${POSTGRES_DB:-routinely}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-routinely}:${POSTGRES_PASSWORD:-routinely}@db:5432/${POSTGRES_DB:-routinely}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Manaus}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_RETRY_MODEL: ${GEMINI_RETRY_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-12000}
      AI_PLANNING_STRATEGY: ${AI_PLANNING_STRATEGY:-order-day}
      AI_RATE_LIMIT_TTL_MS: ${AI_RATE_LIMIT_TTL_MS:-60000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-40}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-200}
      # Portfolio mode: closed signup, shared demo account without AI (see docs/DEPLOY.md)
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_MAX_TASKS: ${DEMO_MAX_TASKS:-15}
      DEMO_MAX_COMMITMENTS: ${DEMO_MAX_COMMITMENTS:-20}
      # Required: signs the login tokens. Generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      # The web container is the one proxy in front of the API (client IP for the rate limit).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - '${API_PORT:-3001}:3001'
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        # Inlined into the browser bundle at build time. Leave empty: the browser calls the web
        # origin (`/api/*`), which proxies to the API, so the login cookies stay first-party.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_DEFAULT_TIMEZONE: ${NEXT_PUBLIC_DEFAULT_TIMEZONE:-America/Manaus}
    environment:
      # Read at request time by the /api proxy (apps/web/src/lib/api-proxy.ts).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
