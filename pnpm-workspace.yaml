packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
  msw: true
  protobufjs: false
  '@parcel/watcher': true
  '@scarf/scarf': false
